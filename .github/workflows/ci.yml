name: CI

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

       - name: Display Python version
         run: python --version

       - name: Run unit tests
         run: python -m unittest discover -s tests -v
